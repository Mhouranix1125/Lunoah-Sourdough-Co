<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg id="logo" width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b47e57"/><stop offset="1" stop-color="#8e5b3a"/></linearGradient>
  <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3b98f"/><stop offset="1" stop-color="#b98458"/></linearGradient>
  <clipPath id="disc"><circle cx="600" cy="600" r="600"/></clipPath>
  <clipPath id="artclip">
    <path d="M0 760 H1200 V1200 H0 Z M0 632 H222 V760 H0 Z M985 632 H1200 V760 H985 Z"/>
  </clipPath>
  <clipPath id="inner"><circle cx="600" cy="600" r="546"/></clipPath>
  <path id="star4" d="M0,-1 C0.12,-0.12 0.12,-0.12 1,0 C0.12,0.12 0.12,0.12 0,1 C-0.12,0.12 -0.12,0.12 -1,0 C-0.12,-0.12 -0.12,-0.12 0,-1Z"/>
  <g id="leaf"><path d="M0,0 C10,-14 30,-16 46,-6 C30,2 12,4 0,0Z" fill="#8f9470"/></g>
</defs>
<g clip-path="url(#disc)">
  <rect width="1200" height="1200" fill="#000"/>
  <!-- original painted loaf, cloth and leaves -->
  <g clip-path="url(#inner)"><image href="art.png" x="0" y="0" width="1200" height="1200" clip-path="url(#artclip)"/></g>
  <!-- rings -->
  <circle cx="600" cy="600" r="560" fill="none" stroke="url(#cu)" stroke-width="3"/>
  <circle cx="600" cy="600" r="548" fill="none" stroke="url(#cu)" stroke-width="1.6" opacity=".8"/>
  <!-- crescent moon -->
  <path d="M602,146 A108,108 0 1 0 628,356 A84,84 0 1 1 602,146Z" fill="url(#moon)"/>
  <!-- stars -->
  <g fill="#d9a77c">
    <use href="#star4" transform="translate(616,258) scale(30)"/>
    <use href="#star4" transform="translate(664,196) scale(11)"/>
    <use href="#star4" transform="translate(466,270) scale(11)"/>
    <use href="#star4" transform="translate(716,282) scale(12)"/>
    <use href="#star4" transform="translate(664,315) scale(10)"/>
  </g>
  <!-- wordmark -->
  <text x="600" y="590" text-anchor="middle" font-family="Cinzel" font-weight="400" font-size="196" letter-spacing="4" fill="url(#cu)">LUNOAH</text>
  <!-- swash tails -->
  <path d="M232,588 C200,610 150,612 128,590" fill="none" stroke="url(#cu)" stroke-width="5" stroke-linecap="round"/>
  <use href="#star4" transform="translate(676,500) scale(26)" fill="#d9a77c"/>
  <text x="600" y="676" text-anchor="middle" font-family="Cormorant Garamond" font-weight="500" font-size="54" letter-spacing="17" fill="#9a6a49">SOURDOUGH CO.</text>
  <!-- divider with sprig -->
  <g stroke="#7a5038" stroke-width="2.5"><line x1="360" y1="732" x2="520" y2="732"/><line x1="680" y1="732" x2="840" y2="732"/></g>
  <g transform="translate(540,732)">
    <path d="M0,0 H120" stroke="#8f9470" stroke-width="3"/>
    <use href="#leaf" transform="translate(30,0) rotate(-20)"/><use href="#leaf" transform="translate(30,0) rotate(20) scale(1,-1)"/>
    <use href="#leaf" transform="translate(60,0) rotate(-20)"/><use href="#leaf" transform="translate(60,0) rotate(20) scale(1,-1)"/>
    <use href="#leaf" transform="translate(88,0) rotate(-14) scale(.8)"/><use href="#leaf" transform="translate(88,0) rotate(14) scale(.8,-.8)"/>
  </g>
</g>
</svg></body></html>
